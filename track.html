<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Track your Millet Mitra order." />
  <title>Track Order | Millet Mitra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#1e241e;--muted:#697067;--paper:#f7f5ef;--card:#fff;--line:#e3e1d8;--accent:#344c36;--soft:#e9eee7}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:55px;gap:20px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.mark{width:44px;height:44px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}.brand strong{display:block;font:700 22px "Playfair Display",serif}.brand small{display:block;color:var(--muted);font-size:12px}.back{color:var(--accent);font-weight:700;text-decoration:none}.hero{text-align:center;margin-bottom:28px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-size:12px;font-weight:700}.hero h1{font:700 48px "Playfair Display",serif;margin:8px 0}.hero p{color:var(--muted);max-width:520px;margin:0 auto;line-height:1.7}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 10px 35px rgba(30,36,30,.05)}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.message{color:#b33;margin-top:14px}.result{margin-top:22px;border-top:1px solid var(--line);padding-top:22px}.order-no{font:700 26px "Playfair Display",serif}.status{display:inline-block;margin:9px 0 20px;padding:7px 12px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:700;text-transform:capitalize}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.step{border:1px solid var(--line);border-radius:12px;padding:13px 8px;text-align:center;font-size:12px;color:var(--muted)}.step b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}.step.active{background:var(--soft);border-color:#cdd8ca;color:var(--ink)}.courier{margin-top:18px;padding:14px;border-radius:12px;background:var(--soft);font-size:14px}.empty{color:var(--muted);padding:10px 0}@media(max-width:600px){.top{margin-bottom:35px}.hero h1{font-size:38px}.steps{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><a class="brand" href="./"><span class="mark">MM</span><span><strong>Millet Mitra</strong><small>From Farmers. For Better Living.</small></span></a><a class="back" href="./">← Shop</a></header>
    <section class="hero"><p class="eyebrow">Delivery tracking</p><h1>Where is my order?</h1><p>Enter your Millet Mitra order number and the mobile number used at checkout.</p></section>
    <section class="card">
      <form id="trackForm"><label for="order">Order number</label><input id="order" placeholder="MIL-XXXXXXXXXX" required autocomplete="off"><label for="phone">Mobile number</label><input id="phone" placeholder="10-digit mobile number" required inputmode="tel" autocomplete="tel"><button class="btn">Track order</button><div id="message" class="message"></div></form>
      <div id="result" class="result" hidden></div>
    </section>
  </main>
  <script>
    const API='https://vgnmkikduqpiarxjbqpg.supabase.co/functions/v1/storefront-api';
    const stages=['pending','packed','shipped','out_for_delivery','delivered'];
    const labels={pending:'Order received',packed:'Packed',shipped:'Shipped',out_for_delivery:'Out for delivery',delivered:'Delivered'};
    const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
    document.getElementById('trackForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('message'),result=document.getElementById('result');msg.textContent='';result.hidden=true;try{const order=encodeURIComponent(document.getElementById('order').value.trim().toUpperCase()),phone=encodeURIComponent(document.getElementById('phone').value.trim());const r=await fetch(`${API}?order=${order}&phone=${phone}`);const body=await r.json();if(!r.ok)throw new Error(body.error||'Unable to find order');const o=body.order;const idx=stages.indexOf(o.status);result.innerHTML=`<div class="order-no">${esc(o.order_number)}</div><div class="status">${esc(o.status.replaceAll('_',' '))}</div><div class="steps">${stages.slice(1).map((s,i)=>`<div class="step ${idx>=i+1?'active':''}"><b>${String(i+2).padStart(2,'0')}</b>${labels[s]}</div>`).join('')}</div>${o.courier_name||o.tracking_number?`<div class="courier"><b>${esc(o.courier_name||'Delivery partner')}</b>${o.tracking_number?`<br>Tracking: ${esc(o.tracking_number)}`:''}</div>`:''}`;result.hidden=false}catch(err){msg.textContent=err.message}};
  </script>
</body>
</html>
