<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Millet Mitra | Catalogue Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--ink:#1e241e;--muted:#697067;--paper:#f7f5ef;--card:#fff;--line:#e3e1d8;--accent:#344c36;--soft:#e9eee7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 20px 60px}.top,.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:22px;font-weight:700}.muted{color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:90px;resize:vertical}label{font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.pic{height:190px;background:#eee;display:grid;place-items:center}.pic img{width:100%;height:100%;object-fit:contain}.body{padding:14px}.price{font-weight:700}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.hidden{display:none!important}.message{color:var(--muted);min-height:20px}.login{max-width:430px;margin:12vh auto}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div id="login" class="wrap"><div class="panel login"><h1>Millet Mitra Admin</h1><p class="muted">Sign in with your Supabase admin account.</p><form id="loginForm"><p><label>Email<input id="email" type="email" required></label></p><p><label>Password<input id="password" type="password" required></label></p><button class="btn primary" style="width:100%">Sign in</button><p id="loginMsg" class="message"></p></form></div></div><main id="app" class="wrap hidden"><header class="top"><div><div class="brand">Millet Mitra — Catalogue</div><div class="muted">Add, edit, hide and change product pictures from one place.</div></div><div><a class="btn" href="./admin.html">Orders</a> <button class="btn" id="logout">Sign out</button></div></header><section class="panel"><div class="bar"><div><h2 id="formTitle">Add product</h2><div class="muted">Use the product-specific picture URL. The storefront will show it immediately.</div></div><button class="btn" id="newProduct">New product</button></div><form id="productForm"><input id="id" type="hidden"><div class="grid"><p><label>Product name<input id="name" required></label></p><p><label>Slug<input id="slug" required placeholder="foxtail-millet"></label></p><p><label>Category<select id="category" required></select></label></p><p><label>Price (base pack)<input id="price" type="number" min="0" step="1" required></label></p><p><label>Unit<input id="unit" value="500 g"></label></p><p><label>Featured<select id="featured"><option value="false">No</option><option value="true">Yes</option></select></label></p><p class="wide"><label>Description<textarea id="description"></textarea></label></p><p class="wide"><label>Product picture URL<input id="image" type="url" placeholder="https://..."></label></p></div><div class="actions"><button class="btn primary" type="submit">Save product</button><button class="btn" type="button" id="cancel">Clear</button></div><p id="formMsg" class="message"></p></form></section><section class="panel"><div class="bar"><div><h2>Live catalogue</h2><div id="schemaMsg" class="muted">Loading…</div></div><button class="btn" id="refresh">Refresh</button></div><div id="cards" class="cards" style="margin-top:15px"></div></section></main><script>const URL='https://vgnmkikduqpiarxjbqpg.supabase.co',KEY='sb_publishable_K30cpgdcYXO8PXS9lRfMNg_HUpW7yyZ',db=window.supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);let products=[],categories=[],imageKey='image_url';const fallback={
'foxtail-millet':'https://www.yuvikaherbs.com/cdn/shop/files/Foxtail_Millets.webp?v=1772775744&width=1445','little-millet':'https://laz-img-sg.alicdn.com/p/4ff8cfb0b4725d925a9bd5abccd67133.jpg','kodo-millet':'https://tiimg.tistatic.com/fp/1/008/902/kodo-millet-156.jpg','barnyard-millet':'https://cdn-dadkn.nitrocdn.com/sorWINhCcXSSLHEaMuKyjzsQObOaRIwB/assets/images/optimized/rev-69158a6/shopgulab.com/wp-content/uploads/2022/08/067A1469.png','pearl-millet':'https://dukaan.b-cdn.net/700x700/webp/media/34c392ba-b3c0-4164-9241-ea8c3a1c7da8.jpg','ragi-flour':'https://img2.exportersindia.com/product_images/bc-full/2025/4/13871295/untitled---1744188094_7987666_2444830.jpg','jowar-flour':'https://www.jiomart.com/images/product/600x600/rvywfntprb/terragreens-organic-jowar-flour-500g-each-pack-of-2-product-images-orvywfntprb-p591755703-0-202205310846.jpg','ragi-cookies':'https://www.manavurufoods.com/web/image/product.product/4/image_1920?unique=8596a7e','millet-murukku':'https://naturessoulshop.com/cdn/shop/files/Millet-Murukku-_E2_80_93-TruMillets-_E2_80_93-125gm.jpg?v=1743192839','millet-mixture':'https://healthyfoodss.com/cdn/shop/files/1_6c61b699-3ed4-46c9-8914-bf6bc8a74070.jpg?v=1744200026','ragi-laddu':'https://skyroots.in/wp-content/uploads/2023/01/Ragi-laddu.jpg','millet-chikkies':'https://cdn.grofers.com/da/cms-assets/cms/product/43819255-b3bd-4bf9-8693-aa513a385ee6.jpg'};
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
async function isAdmin(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data:p}=await db.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role!=='admin'){await db.auth.signOut();$('loginMsg').textContent='This account is not an admin.';return false}return true}
async function load(){const [pc,cc]=await Promise.all([db.from('products').select('*').order('created_at',{ascending:false}),db.from('categories').select('*').order('name')]);if(pc.error){$('schemaMsg').textContent=pc.error.message;return}products=pc.data||[];categories=cc.data||[];if(products[0]){if('image_url' in products[0])imageKey='image_url';else if('image' in products[0])imageKey='image';else imageKey='image_url'}$('schemaMsg').textContent=`${products.length} products. Picture field: ${imageKey}`;$('category').innerHTML=categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');render()}
function render(){if(!products.length){$('cards').innerHTML='<p class="message">No live products yet. Add the first one above.</p>';return}$('cards').innerHTML=products.map(p=>{const img=p[imageKey]||fallback[p.slug]||'';return `<article class="card"><div class="pic">${img?`<img src="${img}" alt="${esc(p.name)}" loading="lazy" referrerpolicy="no-referrer">`:'No image'}</div><div class="body"><b>${esc(p.name)}</b><p class="muted">${esc(p.short_description||'')}</p><div class="price">₹${Number(p.price||0)} · ${esc(p.unit||'')}</div><div class="actions"><button class="btn" data-edit="${p.id}">Edit</button><button class="btn" data-delete="${p.id}">Delete</button></div></div></article>`}).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeProduct(b.dataset.delete))}
function edit(id){const p=products.find(x=>x.id===id);if(!p)return;$('formTitle').textContent='Edit product';$('id').value=p.id;$('name').value=p.name||'';$('slug').value=p.slug||'';$('category').value=p.category_id||'';$('price').value=p.price||0;$('unit').value=p.unit||'';$('featured').value=String(Boolean(p.featured));$('description').value=p.short_description||'';$('image').value=p[imageKey]||fallback[p.slug]||'';window.scrollTo({top:0,behavior:'smooth'})}
function clearForm(){$('formTitle').textContent='Add product';$('productForm').reset();$('id').value='';$('formMsg').textContent=''}
async function removeProduct(id){if(!confirm('Delete this product? This is an admin action.'))return;const {error}=await db.from('products').delete().eq('id',id);if(error){$('schemaMsg').textContent=error.message;return}await load()}
$('productForm').onsubmit=async e=>{e.preventDefault();$('formMsg').textContent='Saving…';const id=$('id').value;const payload={name:$('name').value.trim(),slug:$('slug').value.trim(),category_id:$('category').value,price:Number($('price').value),unit:$('unit').value.trim()||null,short_description:$('description').value.trim()||null,featured:$('featured').value==='true'};payload[imageKey]=$('image').value.trim()||null;let result=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(result.error){$('formMsg').textContent=result.error.message;return}$('formMsg').textContent='Saved. Refreshing storefront catalogue…';clearForm();await load()};$('newProduct').onclick=clearForm;$('cancel').onclick=clearForm;$('refresh').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}if(await isAdmin()){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}};(async()=>{if(await isAdmin()){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}})();</script></body></html>
