<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Millet Mitra | Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e241e;--muted:#697067;--paper:#f7f5ef;--card:#fff;--line:#e3e1d8;--accent:#344c36;--soft:#e9eee7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif}button,input,select{font:inherit}.wrap{max-width:1180px;margin:auto;padding:28px 20px 60px}.top,.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px}.top{margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.mark{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}.brand strong{display:block;font:700 22px "Playfair Display",serif}.brand small{display:block;color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(30,36,30,.04)}.login{max-width:430px;margin:10vh auto}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}.h1{font:700 38px "Playfair Display",serif;margin:7px 0}.muted,.message{color:var(--muted)}label{display:block;font-size:13px;font-weight:600;margin:15px 0 6px}input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}.stat b{display:block;font-size:26px}.stat span{color:var(--muted);font-size:13px}.table-wrap{overflow:auto}.orders{width:100%;border-collapse:collapse;min-width:850px}.orders th,.orders td{padding:14px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.orders th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.orders small{display:block;color:var(--muted);margin-top:3px}.status{border-radius:999px;padding:6px 9px;border:1px solid var(--line);background:var(--soft);font-size:12px}.empty{text-align:center;padding:50px;color:var(--muted)}.hidden{display:none!important}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.note{background:var(--soft);border-radius:12px;padding:12px;font-size:13px;margin-top:12px}@media(max-width:700px){.stats{grid-template-columns:1fr}.h1{font-size:32px}.edit-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head>
<body>
<div id="loginView" class="wrap"><div class="panel login"><p class="eyebrow">Millet Mitra</p><h1 class="h1">Admin sign in</h1><p class="muted">Manage customer orders, delivery status and tracking.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" style="width:100%;margin-top:8px">Sign in</button><p id="loginMsg" class="message"></p></form><div class="note">Only Supabase users with the <b>admin</b> role can access this dashboard.</div></div></div>
<div id="appView" class="wrap hidden"><header class="top"><a class="brand" href="./"><span class="mark">MM</span><span><strong>Millet Mitra</strong><small>Admin dashboard</small></span></a><div><button class="btn" id="refresh">Refresh</button> <button class="btn" id="logout">Sign out</button></div></header><div class="stats"><div class="stat"><b id="total">0</b><span>Total orders</span></div><div class="stat"><b id="pending">0</b><span>Pending</span></div><div class="stat"><b id="shipping">0</b><span>Shipping / delivery</span></div></div><section class="panel"><div class="toolbar"><div><p class="eyebrow">Order management</p><h2 style="margin:5px 0">Customer orders</h2></div><select id="filter" style="max-width:190px"><option value="all">All statuses</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="packed">Packed</option><option value="shipped">Shipped</option><option value="out_for_delivery">Out for delivery</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></div><div id="ordersArea" class="table-wrap"><div class="empty">Loading orders…</div></div><p id="appMsg" class="message"></p></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://vgnmkikduqpiarxjbqpg.supabase.co',KEY='sb_publishable_K30cpgdcYXO8PXS9lRfMNg_HUpW7yyZ',db=window.supabase.createClient(URL,KEY);let orders=[];const $=id=>document.getElementById(id);const money=v=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(v||0);const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
async function admin(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data:p}=await db.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role!=='admin'){await db.auth.signOut();$('loginMsg').textContent='This account is not an admin.';return false}return true}
async function load(){const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){$('appMsg').textContent=error.message;return}orders=data||[];render();$('total').textContent=orders.length;$('pending').textContent=orders.filter(o=>o.status==='pending').length;$('shipping').textContent=orders.filter(o=>['shipped','out_for_delivery'].includes(o.status)).length}
function render(){const f=$('filter').value,list=f==='all'?orders:orders.filter(o=>o.status===f);if(!list.length){$('ordersArea').innerHTML='<div class="empty">No orders found.</div>';return}$('ordersArea').innerHTML='<table class="orders"><thead><tr><th>Order</th><th>Customer</th><th>Delivery</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>'+list.map(o=>'<tr><td><b>'+esc(o.order_number)+'</b><small>'+new Date(o.created_at).toLocaleString('en-IN')+'</small></td><td><b>'+esc(o.customer_name)+'</b><small>'+esc(o.customer_phone)+'</small></td><td>'+esc(o.delivery_address)+'<small>'+esc(o.delivery_city)+', '+esc(o.delivery_state)+' - '+esc(o.delivery_pincode)+'</small></td><td><b>'+money(o.total_amount)+'</b><small>'+esc((o.payment_method||'cod').toUpperCase())+'</small></td><td><span class="status">'+esc(o.status)+'</span>'+(o.tracking_number?'<small>'+esc(o.courier_name||'Courier')+': '+esc(o.tracking_number)+'</small>':'')+'</td><td><button class="btn" data-edit="'+o.id+'">Manage</button></td></tr>').join('')+'</tbody></table>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editor(b.dataset.edit))}
function editor(id){const o=orders.find(x=>x.id===id);if(!o)return;const old=$('editor');if(old)old.remove();const box=document.createElement('div');box.id='editor';box.className='panel';box.style.marginTop='18px';box.innerHTML='<div class="toolbar"><div><p class="eyebrow">'+esc(o.order_number)+'</p><h2 style="margin:5px 0">Update order</h2></div><button class="btn" id="closeEdit">Close</button></div><div class="edit-grid"><label>Status<select id="es">'+['pending','confirmed','packed','shipped','out_for_delivery','delivered','cancelled'].map(s=>'<option value="'+s+'" '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label>Courier name<input id="ec" value="'+esc(o.courier_name||'')+'"></label><label class="wide">Tracking number<input id="et" value="'+esc(o.tracking_number||'')+'"></label><label class="wide">Admin notes<input id="en" value="'+esc(o.admin_notes||'')+'"></label></div><div style="margin-top:14px"><button class="btn primary" id="save">Save changes</button></div><p id="em" class="message"></p>';document.querySelector('section.panel').appendChild(box);$('closeEdit').onclick=()=>box.remove();$('save').onclick=async()=>{const {error}=await db.from('orders').update({status:$('es').value,courier_name:$('ec').value.trim()||null,tracking_number:$('et').value.trim()||null,admin_notes:$('en').value.trim()||null,updated_at:new Date().toISOString()}).eq('id',id);if(error){$('em').textContent=error.message;return}box.remove();await load()}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}if(await admin()){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');load()}};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('refresh').onclick=load;$('filter').onchange=render;(async()=>{if(await admin()){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');load()}})();
</script></body></html>
